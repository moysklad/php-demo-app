services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: php_demo_app
      POSTGRES_USER: php_demo_app
      POSTGRES_PASSWORD: php_demo_app
    ports:
      - "${APP_DB_PORT:-5432}:5432"
    volumes:
      - php-demo-app-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U php_demo_app -d php_demo_app"]
      interval: 2s
      timeout: 3s
      retries: 15

  frontend:
    image: node:24-alpine
    user: node
    working_dir: /app/frontend
    command: sh -c "npm ci --no-audit --no-fund && npm run watch"
    volumes:
      - ./frontend:/app/frontend
      - ./src/php/assets:/app/src/php/assets

  php-demo-app:
    build: .
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      APP_DB_HOST: postgres
      APP_DB_PORT: "5432"
    ports:
      - "${APP_PORT:-8085}:80"
    volumes:
      - ./src/php:/var/www/html/src/php
      - ./db:/var/www/html/db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  php-demo-app-pgdata:
